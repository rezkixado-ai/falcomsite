<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semua Produk — Falcom Technology</title>
<meta name="description" content="Katalog lengkap produk fiber optik, perangkat jaringan, dan solusi ISP dari Falcom Technology.">
<meta name="theme-color" content="#0B0E14">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Lewati ke konten</a>

<nav class="site-nav is-solid"><div class="container">
  <a href="/#top" class="brand"><img src="/img/falcom-logo-navbar.png" alt="Falcom Technology" class="brand-logo"></a>
  <ul class="nav-links">
    <li><a href="/#tentang">Tentang</a></li>
    <li><a href="/#jaringan">Jaringan</a></li>
    <li><a href="/products" class="is-active">Produk</a></li>
    <li><a href="/#klien">Klien</a></li>
    <li><a href="/#artikel">Artikel</a></li>
    <li><a href="/#kontak">Kontak</a></li>
  </ul>
</div></nav>

<main id="main">
  <section class="products-hero">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="/">Home</a><span>/</span><span id="breadcrumbCurrent">Products</span>
      </nav>
      <h1 id="pageTitle">All Products</h1>
      <p id="pageSubtitle" class="products-hero__count"></p>
    </div>
  </section>

  <section class="products-body">
    <div class="container products-layout">
      <aside class="products-sidebar">
        <div class="products-sidebar__head">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
          Categories
        </div>
        <ul id="categoryList"></ul>
      </aside>
      <div class="products-grid-wrap">
        <div class="product-grid" id="productsPageGrid"></div>
        <p id="emptyState" class="products-empty hidden">Belum ada produk pada kategori ini.</p>
      </div>
    </div>
  </section>
</main>

<footer><div class="container footer-row"><span>&copy; <span id="year"></span> Falcom Technology.</span><span>Elevate Connectivity Across Indonesia</span></div></footer>

<!-- CHAT WIDGET -->
<button class="chat-launcher" id="chatLauncher" aria-label="Buka live chat">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>
<div class="chat-window" id="chatWindow" role="dialog" aria-label="Live chat Falcom Technology">
  <div class="chat-head">
    <div class="avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2a5 5 0 015 5v1a5 5 0 01-10 0V7a5 5 0 015-5zM4 21a8 8 0 0116 0" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></div>
    <div>
      <strong>Falcom Assistant</strong>
      <span>Online</span>
    </div>
    <button class="chat-close" id="chatClose" aria-label="Tutup chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-quick" id="chatQuick">
    <button data-q="Produk kabel fiber apa saja?">Produk kabel fiber</button>
    <button data-q="Bagaimana cara order?">Cara order</button>
    <button data-q="Di mana lokasi kantor?">Lokasi kantor</button>
  </div>
  <form class="chat-input" id="chatForm">
    <input type="text" id="chatInput" placeholder="Tulis pesan..." autocomplete="off" required>
    <button type="submit" aria-label="Kirim">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
</div>

<script src="/js/products.js" defer></script>
</body>
</html>
