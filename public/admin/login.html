<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk CMS — Falcom Technology</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="login-body">
  <div class="login-bg" id="loginBg"></div>
  <div class="login-bg-overlay"></div>

  <form class="login-card" id="loginForm">
    <img class="login-logo" src="/img/falcom-logo-white.png" alt="Falcom Technology">
    <h1 class="login-title">Selamat Datang <span>Kembali</span></h1>
    <p class="login-sub">Masuk untuk mengelola konten website Falcom Technology</p>

    <label>Username
      <input type="text" name="username" required autocomplete="username" placeholder="Masukkan username">
    </label>
    <label>Password
      <div class="pw-field">
        <input type="password" name="password" id="loginPassword" required autocomplete="current-password" placeholder="Masukkan password">
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Tampilkan password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </label>
    <p class="login-error" id="loginError"></p>
    <button type="submit" class="btn-solid">Masuk</button>
  </form>

  <script src="/admin/admin.js" defer data-page="login"></script>
  <script>
  (async () => {
    // Rotating background(s), configurable from CMS → Pengaturan (login_bg_1/2/3).
    // Each slot can be an image OR a video — detected by file extension.
    // Falls back to the default gradient in CSS if none are set.
    function isVideoUrl(url) {
      return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url || '');
    }
    try {
      const res = await fetch('/api/settings');
      const s = await res.json();
      const bgs = [s.login_bg_1, s.login_bg_2, s.login_bg_3].filter(Boolean).slice(0, 3);
      if (!bgs.length) return;
      const el = document.getElementById('loginBg');
      let i = 0;
      const layers = bgs.map((url, idx) => {
        let layer;
        if (isVideoUrl(url)) {
          layer = document.createElement('video');
          layer.muted = true; layer.autoplay = true; layer.loop = true; layer.playsInline = true;
          layer.src = url;
        } else {
          layer = document.createElement('div');
          layer.style.backgroundImage = `url("${url}")`;
        }
        layer.className = 'login-bg-layer' + (idx === 0 ? ' is-active' : '');
        el.appendChild(layer);
        return layer;
      });
      if (layers.length > 1) {
        setInterval(() => {
          layers[i].classList.remove('is-active');
          i = (i + 1) % layers.length;
          layers[i].classList.add('is-active');
        }, 8000);
      }
    } catch (e) { /* keep default gradient background */ }
  })();

  document.getElementById('pwToggle').addEventListener('click', () => {
    const input = document.getElementById('loginPassword');
    input.type = input.type === 'password' ? 'text' : 'password';
  });
  </script>
</body>
</html>
